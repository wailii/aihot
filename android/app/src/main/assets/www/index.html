<!doctype html>
<html lang="zh-CN" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<title>AI 热点 App</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="studio">
  <div class="studio-name">AI 热点 · 手机版原型</div>
  <div class="studio-switch" role="tablist" aria-label="设计方向">
    <button data-dir="paper" role="tab">A 报刊</button>
    <button data-dir="signal" role="tab">B 汇流</button>
    <button data-dir="deck" role="tab">C 卡堆</button>
  </div>
  <div class="studio-status" id="dataStatus">载入中</div>
</header>
<main class="stage">
  <div class="phone">
    <div class="statusbar"><span id="sbTime">19:49</span><span class="sb-right"><i class="sb-sig"></i><i class="sb-bat"></i></span></div>
    <div id="app"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</main>
<script src="snapshot.js"></script>
<script src="core.js"></script>
<script src="dir-paper.js"></script>
<script src="dir-signal.js"></script>
<script src="dir-deck.js"></script>
<script src="listen.js"></script>
<script src="translate.js"></script>
<script src="main.js"></script>
</body>
</html>
